<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trova - Search Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary": "#47545a",
              "on-primary": "#122479",
              "on-tertiary-container": "#650d58",
              "on-primary-fixed": "#00083f",
              "primary-fixed-dim": "#8998f0",
              "surface-container": "#151a21",
              "on-secondary-container": "#c5d2da",
              "primary-dim": "#8998f0",
              "tertiary": "#ffade6",
              "on-tertiary": "#711a62",
              "on-secondary-fixed-variant": "#515d64",
              "on-tertiary-fixed-variant": "#701961",
              "on-primary-container": "#00156d",
              "inverse-surface": "#f8f9ff",
              "surface-container-low": "#0f141a",
              "error": "#ff6e84",
              "background": "#0a0e14",
              "secondary-fixed": "#d7e4ec",
              "on-primary-fixed-variant": "#1b2c7f",
              "on-surface-variant": "#a8abb3",
              "secondary-fixed-dim": "#c9d6de",
              "surface-variant": "#20262f",
              "tertiary-dim": "#f088d4",
              "outline": "#72757d",
              "tertiary-fixed": "#ff95e3",
              "primary-container": "#8c9bf3",
              "surface-dim": "#0a0e14",
              "secondary": "#d7e4ec",
              "inverse-primary": "#4958ac",
              "error-dim": "#d73357",
              "inverse-on-surface": "#51555c",
              "primary-fixed": "#96a5ff",
              "tertiary-container": "#ff95e3",
              "on-surface": "#f1f3fc",
              "on-error": "#490013",
              "outline-variant": "#44484f",
              "surface-bright": "#262c36",
              "on-error-container": "#ffb2b9",
              "surface-tint": "#9aa8ff",
              "surface": "#0a0e14",
              "on-secondary-fixed": "#354147",
              "on-background": "#f1f3fc",
              "surface-container-lowest": "#000000",
              "secondary-dim": "#c9d6de",
              "error-container": "#a70138",
              "on-tertiary-fixed": "#430039",
              "secondary-container": "#3c494f",
              "surface-container-highest": "#20262f",
              "tertiary-fixed-dim": "#f088d4",
              "surface-container-high": "#1b2028",
              "primary": "#9aa8ff"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes spinner-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spinner-slow {
            animation: spinner-slow 2s linear infinite;
        }
        .tonal-layering {
            background: linear-gradient(180deg, #151a21 0%, #0a0e14 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#0a0e14] dark:bg-[#0a0e14]">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#9aa8ff] dark:text-[#9aa8ff]" data-icon="movie_filter">movie_filter</span>
<h1 class="text-2xl font-black tracking-tighter text-[#9aa8ff] dark:text-[#9aa8ff] font-headline">Trova</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#20262f] transition-colors duration-200 active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#a8abb3]" data-icon="settings">settings</span>
</button>
</header>
<main class="pt-24 pb-32 px-6 max-w-4xl mx-auto flex flex-col min-h-screen">
<!-- Search Panel -->
<section class="mb-12">
<div class="relative group">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary-dim" data-icon="search">search</span>
</div>
<input class="w-full h-14 pl-14 pr-6 bg-surface-container-highest border-none rounded-xl text-on-surface font-medium placeholder-on-surface-variant focus:ring-2 focus:ring-primary/50 transition-all cursor-default" readonly="" type="text" value="Inception"/>
<div class="absolute inset-y-0 right-4 flex items-center">
<button class="p-2 rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="close">close</span>
</button>
</div>
</div>
<div class="mt-4 flex flex-wrap gap-2">
<span class="px-3 py-1 bg-surface-container rounded-full text-xs font-semibold text-on-surface-variant tracking-wide">MOVIES</span>
<span class="px-3 py-1 bg-surface-container rounded-full text-xs font-semibold text-on-surface-variant tracking-wide">SCIFI</span>
<span class="px-3 py-1 bg-surface-container rounded-full text-xs font-semibold text-on-surface-variant tracking-wide">DIRECTOR: NOLAN</span>
</div>
</section>
<!-- Loading State Panel -->
<section class="flex-grow flex flex-col items-center justify-center text-center">
<!-- Sleek Loading Animation -->
<div class="relative mb-8">
<!-- Inner Glow -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full scale-150"></div>
<!-- Spinner -->
<div class="relative w-24 h-24">
<svg class="w-full h-full animate-spinner-slow" viewbox="0 0 100 100">
<defs>
<lineargradient id="spinner-gradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#9aa8ff"></stop>
<stop offset="100%" stop-color="#8c9bf3"></stop>
</lineargradient>
</defs>
<circle class="opacity-10" cx="50" cy="50" fill="transparent" r="42" stroke="currentColor" stroke-width="6"></circle>
<path class="text-primary" d="M 50 8 A 42 42 0 0 1 92 50" fill="transparent" stroke="url(#spinner-gradient)" stroke-linecap="round" stroke-width="6">
</path>
</svg>
<!-- Center Icon -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-dim text-3xl opacity-50" data-icon="travel_explore">travel_explore</span>
</div>
</div>
</div>
<!-- Loading Text -->
<h2 class="text-2xl font-bold font-headline tracking-tight text-on-surface mb-2">Searching our database...</h2>
<p class="text-on-surface-variant text-sm font-medium max-w-xs leading-relaxed">
                Curating the finest cinematic experiences matching your query. This will only take a moment.
            </p>
<!-- Skeleton Teaser (Asymmetric/Bento Style) -->
<div class="mt-16 w-full grid grid-cols-6 grid-rows-2 gap-4 opacity-20 pointer-events-none">
<div class="col-span-4 h-48 bg-surface-container rounded-xl"></div>
<div class="col-span-2 h-48 bg-surface-container rounded-xl"></div>
<div class="col-span-2 h-32 bg-surface-container rounded-xl"></div>
<div class="col-span-4 h-32 bg-surface-container rounded-xl"></div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 h-20 pb-safe bg-[#0a0e14]/80 backdrop-blur-xl dark:bg-[#0a0e14]/80 border-t border-[#44484f]/15">
<a class="flex flex-col items-center justify-center text-[#9aa8ff] bg-[#151a21] rounded-xl px-4 py-1 transition-transform duration-200 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="text-[11px] font-semibold font-[Inter] tracking-wide">Search</span>
</a>
<a class="flex flex-col items-center justify-center text-[#a8abb3] hover:text-white transition-all" href="#">
<span class="material-symbols-outlined" data-icon="bookmarks">bookmarks</span>
<span class="text-[11px] font-semibold font-[Inter] tracking-wide">Watchlist</span>
</a>
<a class="flex flex-col items-center justify-center text-[#a8abb3] hover:text-white transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[11px] font-semibold font-[Inter] tracking-wide">Profile</span>
</a>
</nav>
</body></html>
