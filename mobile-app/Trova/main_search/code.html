<script>
    document.addEventListener('DOMContentLoaded', () => {
        const movieButton = document.querySelector('.flex.gap-3 button:nth-child(1)');
        const tvShowButton = document.querySelector('.flex.gap-3 button:nth-child(2)');
        let currentFilter = 'movie'; // Default filter

        function updateFilterButtons() {
            if (currentFilter === 'movie') {
                movieButton.classList.add('bg-primary', 'text-on-primary');
                movieButton.classList.remove('bg-surface-container', 'border', 'border-outline-variant/15', 'text-on-surface-variant', 'hover:bg-surface-variant');
                tvShowButton.classList.remove('bg-primary', 'text-on-primary');
                tvShowButton.classList.add('bg-surface-container', 'border', 'border-outline-variant/15', 'text-on-surface-variant', 'hover:bg-surface-variant');
            } else if (currentFilter === 'tv') {
                tvShowButton.classList.add('bg-primary', 'text-on-primary');
                tvShowButton.classList.remove('bg-surface-container', 'border', 'border-outline-variant/15', 'text-on-surface-variant', 'hover:bg-surface-variant');
                movieButton.classList.remove('bg-primary', 'text-on-primary');
                movieButton.classList.add('bg-surface-container', 'border', 'border-outline-variant/15', 'text-on-surface-variant', 'hover:bg-surface-variant');
            }
            console.log('Current filter:', currentFilter);
            // Here you would typically trigger a search with the new filter
        }

        movieButton.addEventListener('click', () => {
            currentFilter = 'movie';
            updateFilterButtons();
        });

        tvShowButton.addEventListener('click', () => {
            currentFilter = 'tv';
            updateFilterButtons();
        });

        // Initialize button states
        updateFilterButtons();
    });
</script>
