<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trova - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-error": "#490013",
              "primary-container": "#8c9bf3",
              "on-surface": "#f1f3fc",
              "surface-container": "#151a21",
              "on-tertiary-fixed": "#430039",
              "surface-tint": "#9aa8ff",
              "on-tertiary-container": "#650d58",
              "surface-container-low": "#0f141a",
              "tertiary-container": "#ff95e3",
              "background": "#0a0e14",
              "on-primary-container": "#00156d",
              "surface-container-highest": "#20262f",
              "secondary-fixed": "#d7e4ec",
              "on-background": "#f1f3fc",
              "tertiary-fixed-dim": "#f088d4",
              "outline": "#72757d",
              "tertiary-fixed": "#ff95e3",
              "on-secondary-fixed-variant": "#515d64",
              "primary-fixed-dim": "#8998f0",
              "inverse-surface": "#f8f9ff",
              "error-dim": "#d73357",
              "inverse-primary": "#4958ac",
              "primary-fixed": "#96a5ff",
              "surface-variant": "#20262f",
              "on-primary-fixed-variant": "#1b2c7f",
              "on-secondary-container": "#c5d2da",
              "on-primary": "#122479",
              "secondary-container": "#3c494f",
              "outline-variant": "#44484f",
              "secondary-fixed-dim": "#c9d6de",
              "on-primary-fixed": "#00083f",
              "on-tertiary": "#711a62",
              "error-container": "#a70138",
              "surface-container-lowest": "#000000",
              "surface-container-high": "#1b2028",
              "on-surface-variant": "#a8abb3",
              "primary": "#9aa8ff",
              "error": "#ff6e84",
              "secondary": "#d7e4ec",
              "tertiary": "#ffade6",
              "surface-bright": "#262c36",
              "surface": "#0a0e14",
              "secondary-dim": "#c9d6de",
              "on-tertiary-fixed-variant": "#701961",
              "tertiary-dim": "#f088d4",
              "on-secondary-fixed": "#354147",
              "primary-dim": "#8998f0",
              "inverse-on-surface": "#51555c",
              "on-secondary": "#47545a",
              "surface-dim": "#0a0e14",
              "on-error-container": "#ffb2b9"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #0a0e14;
        color: #f1f3fc;
      }
    </style>
<style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
</head>
<body class="font-body selection:bg-primary/30 antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#151a21] border-none flex items-center justify-between px-6 py-4">
<div class="flex items-center gap-4">
<button class="hover:bg-white/10 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[#9aa8ff]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold tracking-tight text-white text-xl">Settings</h1>
</div>
<div class="flex items-center gap-4">
<span class="text-xl font-bold text-white tracking-tighter" style="font-family: 'Manrope';">Trova</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<!-- Appearance Section -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm" data-icon="palette">palette</span>
<h3 class="font-headline text-xs font-extrabold uppercase tracking-widest text-on-surface-variant">Appearance</h3>
</div>
<div class="bg-surface-container rounded-xl overflow-hidden divide-y divide-outline-variant/10">
<div class="p-5 flex flex-col gap-4">
<div class="flex items-center justify-between">
<span class="font-body text-on-surface font-medium">Theme Mode</span>
</div>
<div class="grid grid-cols-2 gap-3 p-1 bg-surface-container-high rounded-lg">
<button class="flex items-center justify-center gap-2 py-2 px-4 rounded-md text-[#a8abb3] hover:text-white transition-all">
<span class="material-symbols-outlined text-lg" data-icon="light_mode">light_mode</span>
<span class="text-sm font-medium">Light</span>
</button>
<button class="flex items-center justify-center gap-2 py-2 px-4 rounded-md bg-gradient-to-br from-[#9aa8ff] to-[#8c9bf3] text-white shadow-lg">
<span class="material-symbols-outlined text-lg" data-icon="dark_mode" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
<span class="text-sm font-medium">Dark</span>
</button>
</div>
</div>
<div class="p-5 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body text-on-surface font-medium">Sync with System</span>
<span class="text-xs text-on-surface-variant">Automatically match device settings</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<div class="text-center py-10">
<p class="text-[10px] font-bold text-on-surface-variant tracking-[0.2em] uppercase opacity-40">Trova v2.4.1 (Build 882)</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-[#0a0e14]/80 backdrop-blur-2xl z-50 rounded-t-3xl shadow-[0_-8px_30px_rgb(0,0,0,0.12)]">
<button class="flex flex-col items-center justify-center text-[#a8abb3] px-5 py-2 hover:text-white transition-all active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-[#a8abb3] px-5 py-2 hover:text-white transition-all active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="explore">explore</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Discovery</span>
</button>
<button class="flex flex-col items-center justify-center text-[#a8abb3] px-5 py-2 hover:text-white transition-all active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="video_library">video_library</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Library</span>
</button>
<button class="flex flex-col items-center justify-center bg-gradient-to-br from-[#9aa8ff] to-[#8c9bf3] text-white rounded-2xl px-5 py-2 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Profile</span>
</button>
</nav>
</body></html>
